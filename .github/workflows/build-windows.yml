name: Build Windows Executable

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
    types: [closed]

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Build single-file executable
        # 한 줄 명령(PowerShell 기본 셸 — CMD '^' 연결 문자 사용 불가).
        # --collect-submodules로 함수-지역 import되는 stardustlib 서브모듈을 모두 포함.
        run: pyinstaller --onefile --name stardustfs --clean --collect-submodules stardustlib --hidden-import=aiohttp stardustfs.py

      - name: Verify executable
        run: dist\stardustfs.exe --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stardustfs-windows-x64
          path: dist/stardustfs.exe
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/stardustfs.exe
