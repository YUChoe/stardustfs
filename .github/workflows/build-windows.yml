name: Build Windows Executable

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Build directory bundle (onedir)
        # 한 줄 명령(PowerShell 기본 셸 — CMD '^' 연결 문자 사용 불가).
        # --onedir: onefile 대신 실행파일 + 라이브러리를 같은 디렉토리(dist/stardustfs/,
        #   PyInstaller 6.x는 _internal/에 라이브러리 동봉)에 풀어 둔다.
        # --collect-submodules로 함수-지역 import되는 stardustlib 서브모듈을 모두 포함.
        # PIL.ImageTk는 지연 import(브랜드 창 아이콘)라 정적 분석이 놓칠 수 있어 명시.
        # --icon: 실행파일 아이콘을 브랜드 마크(.ico)로 지정.
        run: pyinstaller --onedir --name stardustfs --clean --icon stardustlib/gui/assets/icon.ico --collect-submodules stardustlib --collect-data sv_ttk --hidden-import=aiohttp --hidden-import=PIL.ImageTk stardustfs.py

      - name: Verify executable
        run: dist\stardustfs\stardustfs.exe --help

      - name: Package as zip
        # dist/stardustfs 디렉토리를 통째로 압축 → 압축 해제 시 stardustfs/ 폴더가 생긴다.
        run: Compress-Archive -Path dist\stardustfs -DestinationPath dist\stardustfs-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stardustfs-windows-x64
          path: dist/stardustfs-windows-x64.zip
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/stardustfs-windows-x64.zip
